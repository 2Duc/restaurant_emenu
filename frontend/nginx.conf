# File mẫu (nginx:alpine tự thay ${BIEN} bằng biến môi trường lúc khởi động container; $uri giữ nguyên vì không phải biến môi trường).
# CSP_CONNECT_SRC: nguồn API + WebSocket (vd "http://192.168.1.5:8000 ws://192.168.1.5:8000" hoặc "https://api.ten.com wss://api.ten.com").
# CSP_IMG_SRC: nguồn ảnh món (media của backend), vd "http://192.168.1.5:8000".
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: ${CSP_IMG_SRC}; connect-src 'self' ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location / { try_files $uri /index.html; }
}
